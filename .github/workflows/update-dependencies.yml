name: Update Dependencies
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-dependencies.yml
      - package.json
      - package-lock.json
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Get node version from Dockerfile
      id: node-version
      run: |
        echo "node-version=$(head -1 Dockerfile | sed 's/FROM node://g')" >> $GITHUB_OUTPUT
    - uses: actions/setup-node@v7
      with:
        node-version: '${{steps.node-version.outputs.node-version}}'
        cache: npm
    - id: update-dependencies
      run: |
        npm update
        if [ -n "$(git status --porcelain)" ]; then
          echo "update_required=true" >> $GITHUB_OUTPUT
        else
          echo "update_required=false" >> $GITHUB_OUTPUT
        fi
    - run: npm test
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
    - name: Create token for GitHub App
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ secrets.BOT_APP_ID }}
        private-key: ${{ secrets.BOT_PRIVATE_KEY }}
    - name: Set token to env
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
      run: echo GH_TOKEN=${{ steps.app-token.outputs.token }} >> $GITHUB_ENV
    - name: Commit and push changes
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json package-lock.json
        git commit -m 'Run `npm update`'
        git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:main
