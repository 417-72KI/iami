name: Update Dependencies
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-dependencies.yml
      - package.json
      - package-lock.json
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
    - name: Create token for GitHub App
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        client-id: ${{ secrets.BOT_CLIENT_ID }}
        private-key: ${{ secrets.BOT_PRIVATE_KEY }}
    - uses: actions/checkout@v7
      with: 
        token: ${{ steps.app-token.outputs.token }}
    - name: Get node version from Dockerfile
      id: node-version
      run: |
        echo "node-version=$(head -1 Dockerfile | sed 's/FROM node://g')" >> $GITHUB_OUTPUT
    - uses: actions/setup-node@v7
      with:
        node-version: '${{steps.node-version.outputs.node-version}}'
        cache: npm
    - id: update-dependencies
      run: |
        npm update
        if [ -n "$(git status --porcelain)" ]; then
          echo "update_required=true" >> $GITHUB_OUTPUT
        else
          echo "update_required=false" >> $GITHUB_OUTPUT
        fi
    - run: npm test
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
    - name: Commit and push changes
      if: ${{ steps.update-dependencies.outputs.update_required == 'true' }}
      env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
        git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
        git config --global user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
        git add package.json package-lock.json
        git commit -m 'Run `npm update`'
        git push
